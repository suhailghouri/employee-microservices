
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /employees
            pathType: Prefix
            backend:
              service:
                name: employee-service
                port:
                  number: 8000

          - path: /departments
            pathType: Prefix
            backend:
              service:
                name: department-service
                port:
                  number: 8000
