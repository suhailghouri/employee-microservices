
apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: department-service
  template:
    metadata:
      labels:
        app: department-service
    spec:
      containers:
        - name: department-service
          image: ghcr.io/suhailghouri/employee-microservices/department-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: EMPLOYEE_SERVICE_URL
              value: "http://employee-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: department-service
spec:
  selector:
    app: department-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
