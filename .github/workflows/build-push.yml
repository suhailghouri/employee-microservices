
name: Build and Push Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Employee Service
        uses: docker/build-push-action@v6
        with:
          context: ./employee-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/employee-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/employee-service:latest

      - name: Build and push Department Service
        uses: docker/build-push-action@v6
        with:
          context: ./department-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/department-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/department-service:latest
